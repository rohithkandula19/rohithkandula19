name: Connect 4

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: connect4
  cancel-in-progress: false

jobs:
  move:
    if: startsWith(github.event.issue.title, 'c4|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Play move
        env:
          # passed via env, never interpolated into shell — issue titles are untrusted
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: python3 scripts/connect4_move.py
      - name: Commit board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md games/connect4
          git diff --cached --quiet || { git commit -m "connect4: move via issue #${{ github.event.issue.number }} [skip ci]"; git pull --rebase origin main; git push; }
      - name: Reply and close issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file games/connect4/comment.txt
          gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
