name: Pac-Man graph

on:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
      - name: Commit if changed
        run: |
          git config user.name "Rohith Kandula"
          git config user.email "203910037+rohithkandula19@users.noreply.github.com"
          git add dist
          git diff --cached --quiet || { git commit -m "chore: regenerate pac-man graph [skip ci]"; git pull --rebase origin main; git push; }
