name: Refresh profile

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update README sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_readme.py
      - name: Regenerate contribution jungle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/monkey_graph.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet README.md dist/monkey-jungle.svg 2>/dev/null || [ -n "$(git status --porcelain dist/monkey-jungle.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md dist/monkey-jungle.svg
            git commit -m "chore: refresh live status + shipped feed [skip ci]"
            git pull --rebase origin main
            git push
          else
            echo "No changes."
          fi
